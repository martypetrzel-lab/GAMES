name: Kontroly kvality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gameradar_cz?schema=public
      CHEAPSHARK_USER_AGENT: GameRadarCZ/0.1 (+https://github.com/martypetrzel-lab/GAMES)
      CNB_API_BASE_URL: https://api.cnb.cz/cnbapi
      ADS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:validate
      - run: pnpm build
